name: Client linting

on:
  push:
    branches: ["main"]
    paths:
      - "client/**"
      - ".github/workflows/client-linting.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "client/**"
      - ".github/workflows/client-linting.yml"

permissions:
  contents: read

concurrency:
  group: client-linting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run client linting
        run: npm run lint
