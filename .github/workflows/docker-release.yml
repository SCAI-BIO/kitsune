name: Release images

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images
  cancel-in-progress: false

jobs:
  build_docker_image:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release
        uses: actions/checkout@v7

      - name: Set repository name
        id: repository
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract and validate version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' is not a semantic version"
            exit 1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Update API version
        working-directory: api
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          sed -i \
            "s/APP_VERSION = \"[^\"]*\"/APP_VERSION = \"$VERSION\"/" \
            src/kitsune/app/config.py

          grep -Fq \
            "APP_VERSION = \"$VERSION\"" \
            src/kitsune/app/config.py

          uv version "$VERSION"

      - name: Update client version
        working-directory: client
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate client metadata
        id: client-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.repository.outputs.name }}/client
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}

      - name: Build and push client
        uses: docker/build-push-action@v7
        with:
          context: ./client
          file: ./client/Dockerfile.prod
          push: true
          tags: ${{ steps.client-meta.outputs.tags }}
          labels: ${{ steps.client-meta.outputs.labels }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
          sbom: true
          provenance: mode=max

      - name: Generate api metadata
        id: api-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.repository.outputs.name }}/api
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}

      - name: Build and push api
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          sbom: true
          provenance: mode=max

      - name: Generate Ollama metadata
        id: ollama-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.repository.outputs.name }}/ollama
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.value }}

      - name: Build and push Ollama
        uses: docker/build-push-action@v7
        with:
          context: ./ollama
          file: ./ollama/Dockerfile
          push: true
          tags: ${{ steps.ollama-meta.outputs.tags }}
          labels: ${{ steps.ollama-meta.outputs.labels }}
          cache-from: type=gha,scope=ollama
          cache-to: type=gha,mode=max,scope=ollama
          sbom: true
          provenance: mode=max
